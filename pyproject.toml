[project]
name = "Agent-Smith"
version = "0.1.0"
description = "Agent Smith - 42 project by Jeremy Foeller"
readme = "README.md"
authors = [
    { name = "jfoeller", email = "jeremy.foeller@learner.42.tech" }
]

requires-python = ">=3.10, <3.11"

dependencies = [
    "pydantic",
    "httpx",
    "mcp[cli]>=1.22.0",
    "python-dotenv",
    "fire",
    "tqdm",
    "docker"
]

[dependency-groups]
dev = [
	"flake8",
	"mypy",
	"pydocstyle"
]

[tool.pydocstyle]
convention = "google"

[[tool.mypy.overrides]]
module = ["fire.*", "tqdm.*", "docker.*"]
ignore_missing_imports = true

[project.scripts]
sandbox = "src.sandbox.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]